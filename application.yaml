server:
  port: 8080

spring:
  application:
    name: automated-test-mcp-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key}
      model: ${LLM_MODEL_NAME:gpt-4o}

gitlab:
  host-url: ${GITLAB_URL:https://gitlab.com}
  personal-access-token: ${GITLAB_TOKEN}
  project-id: ${GITLAB_PROJECT_ID}
  webhook-secret-token: ${GITLAB_WEBHOOK_SECRET:super-secure-token}

repo:
  local-path: ${LOCAL_REPO_PATH}

coverage:
  # The strict percentage bar. Code below this number gets rejected.
  min-required-percentage: 80.0
  
